# F14 trait-to-drill mapping. A weakness fires when `metric op value` holds; it is ranked by
# severity = |metric - value| / scale, gets 1-3 drills, and the evidence segment is the fusion
# segment with the worst `evidence` feature (direction max|min). Sources: voice, gaze, face,
# face_va, physio (E1), content (E4), fusion (E3), traits.

weaknesses:
  - {id: too_fast,        label: "Speaking too fast",            metric: voice.wpm,                op: ">",  value: 175,  scale: 40,   evidence: {feature: wpm, direction: max},          drills: [pace_metronome, pause_after_point, breath_phrasing]}
  - {id: too_slow,        label: "Speaking too slowly",          metric: voice.wpm,                op: "<",  value: 105,  scale: 40,   evidence: {feature: wpm, direction: min},          drills: [pace_ladder, energy_read]}
  - {id: fillers,         label: "Frequent filler words",        metric: voice.filler_rate_per_min, op: ">", value: 3,    scale: 6,    evidence: {feature: filler_rate, direction: max},  drills: [filler_pause_swap, filler_buddy, record_count]}
  - {id: monotone,        label: "Monotone delivery",            metric: voice.pitch_std_st,       op: "<",  value: 2.0,  scale: 1.5,  evidence: {feature: pitch_std_st, direction: min}, drills: [pitch_ladder, emphasis_marking, character_voices]}
  - {id: flat_volume,     label: "Little variation in volume",   metric: voice.energy_std_db,      op: "<",  value: 4.0,  scale: 3,    evidence: {feature: energy_rel_db, direction: min}, drills: [volume_dial, projection_wall]}
  - {id: no_pauses,       label: "Hardly any pauses",            metric: voice.pause_ratio,        op: "<",  value: 0.04, scale: 0.04, evidence: {feature: pause_ratio, direction: min},  drills: [pause_after_point, breath_phrasing]}
  - {id: long_pauses,     label: "Long, unplanned silences",     metric: voice.long_pause_count,   op: ">=", value: 3,    scale: 4,    evidence: {feature: pause_ratio, direction: max},  drills: [bridge_phrases, cue_cards]}
  - {id: low_eye_contact, label: "Looking away from the audience", metric: gaze.on_grid_ratio,     op: "<",  value: 0.65, scale: 0.3,  evidence: {feature: on_grid, direction: min},      drills: [eye_contact_thought, notes_glance, lighthouse_sweep]}
  - {id: neglected_zones, label: "Ignoring parts of the room",   metric: gaze.neglected_count,     op: ">=", value: 3,    scale: 4,    evidence: {feature: gaze_cells, direction: min},   drills: [lighthouse_sweep, zone_assignment]}
  - {id: stiff_face,      label: "Low facial expressiveness",    metric: face_va.expressiveness,   op: "<",  value: 0.08, scale: 0.08, evidence: {feature: face_va_std, direction: min},  drills: [mirror_expressions, smile_onset]}
  - {id: head_fidget,     label: "Restless head movement",       metric: fusion.head_motion,       op: ">",  value: 4,    scale: 6,    evidence: {feature: head_motion, direction: max},  drills: [grounding_stance, still_point]}
  - {id: high_blink,      label: "Very high blink rate",         metric: face.blink_rate_per_min,  op: ">",  value: 35,   scale: 20,   evidence: {feature: blink_rate, direction: max},   drills: [box_breathing, soft_focus]}
  - {id: physio_stress,   label: "Heart rate climbing (stress)", metric: physio.bpm_rise,          op: ">",  value: 15,   scale: 15,   evidence: {feature: bpm_rise, direction: max},     drills: [box_breathing, slow_exhale, prep_ritual]}
  - {id: mismatch,        label: "Voice and face disagree",      metric: fusion.mismatch_count,    op: ">=", value: 2,    scale: 4,    evidence: {feature: congruence_distance, direction: max}, drills: [emotion_mapping, mirror_rehearsal]}
  - {id: weak_opener,     label: "Weak opening",                 metric: content.opener_score,     op: "<",  value: 0.7,  scale: 0.5,  evidence: {feature: first, direction: first},      drills: [hook_rewrite, cold_open]}
  - {id: weak_closer,     label: "Abrupt ending",                metric: content.closer_score,     op: "<",  value: 0.7,  scale: 0.5,  evidence: {feature: last, direction: last},        drills: [cta_close, callback_close]}
  - {id: few_transitions, label: "Few signposts between ideas",  metric: content.transition_quality, op: "<", value: 0.4, scale: 0.4,  evidence: null, drills: [signpost_map, bridge_phrases]}
  - {id: few_devices,     label: "Few rhetorical devices",       metric: content.device_count,     op: "<",  value: 2,    scale: 2,    evidence: null, drills: [rule_of_three, anaphora_practice]}
  - {id: low_pathos,      label: "Little emotional appeal",      metric: content.pathos,           op: "<",  value: 0.2,  scale: 0.2,  evidence: null, drills: [story_injection, sensory_detail]}
  - {id: low_logos,       label: "Little evidence or reasoning", metric: content.logos,            op: "<",  value: 0.2,  scale: 0.2,  evidence: null, drills: [evidence_sandwich]}
  - {id: low_confidence,  label: "Low overall confidence",       metric: traits.confidence,        op: "<",  value: 55,   scale: 30,   evidence: {feature: confidence, direction: min}, drills: [prep_ritual, record_count]}

drills:
  pace_metronome:     {title: "Metronome reading", minutes: 5, focus: pace, steps: ["Set a metronome to 140 bpm.", "Read a paragraph aloud, one word per beat.", "Repeat at 130 bpm, then speak your opening at that pace without it."], why: "Anchors a comfortable 130-150 wpm."}
  pace_ladder:        {title: "Pace ladder", minutes: 5, focus: pace, steps: ["Read one paragraph slowly, then at normal speed, then fast.", "Record the normal-speed pass and aim for 130-160 wpm."], why: "Builds a feel for a lively but clear pace."}
  pause_after_point:  {title: "Pause after the point", minutes: 5, focus: pausing, steps: ["Mark the key sentence in each paragraph of your speech.", "After each one, count two seconds silently before going on.", "Record it and check the pauses feel deliberate."], why: "Pauses give listeners time to absorb and make you sound in control."}
  breath_phrasing:    {title: "Breath phrasing", minutes: 5, focus: pace, steps: ["Split your script into breath-sized phrases with a slash.", "Breathe at every slash while practising."], why: "Stops rushing by tying pace to breathing."}
  energy_read:        {title: "Newsreader energy", minutes: 4, focus: energy, steps: ["Read a news article aloud as if live on air.", "Lift the pace and stress one word per sentence."], why: "Raises energy and pace together."}
  filler_pause_swap:  {title: "Swap fillers for silence", minutes: 6, focus: fluency, steps: ["Talk for 60 s on a random topic.", "Each time you feel an 'um' coming, close your mouth and pause instead.", "Repeat three times; count the fillers on the recording."], why: "A silent pause sounds confident; a filler sounds unsure."}
  filler_buddy:       {title: "Filler buddy", minutes: 5, focus: fluency, steps: ["Ask a friend to tap the table at every filler.", "Speak for two minutes; try to halve the taps on the second round."], why: "Instant feedback makes the habit visible."}
  record_count:       {title: "Record and count", minutes: 5, focus: fluency, steps: ["Record a one-minute answer to a common interview question.", "Write down every filler and repeated phrase.", "Re-record with the list in front of you."], why: "Awareness is most of the fix."}
  pitch_ladder:       {title: "Pitch ladder", minutes: 4, focus: intonation, steps: ["Say 'This really matters' five times, each a step higher.", "Then read your opening and rise on the key word of each sentence."], why: "Widens your usable pitch range."}
  emphasis_marking:   {title: "Emphasis marking", minutes: 6, focus: intonation, steps: ["Underline one word per sentence in your script.", "Read it, stressing only those words with pitch and volume."], why: "Varied stress is what stops a voice sounding monotone."}
  character_voices:   {title: "Story voices", minutes: 5, focus: intonation, steps: ["Tell a short story with a dialogue in it.", "Give each character a different pitch and speed."], why: "Exaggeration in practice becomes natural variety in delivery."}
  volume_dial:        {title: "Volume dial", minutes: 4, focus: energy, steps: ["Read a paragraph at volume 3, then 6, then 9 out of 10.", "Deliver your main point at 7 and an aside at 4."], why: "Volume contrast signals what matters."}
  projection_wall:    {title: "Project to the back wall", minutes: 4, focus: energy, steps: ["Stand facing the far wall of a room.", "Speak your opening so it would be clear at the wall, without shouting."], why: "Builds supported, audible energy."}
  bridge_phrases:     {title: "Bridge phrases", minutes: 5, focus: structure, steps: ["Prepare three bridges: 'That brings me to...', 'Here's why that matters...', 'So what does this mean?'.", "Use one whenever you lose the thread instead of going silent."], why: "Bridges cover lost threads and signpost the next idea."}
  cue_cards:          {title: "Keyword cue cards", minutes: 8, focus: structure, steps: ["Reduce your speech to five keywords, one per card.", "Rehearse speaking from the keywords only."], why: "Removes long searches for the next sentence."}
  eye_contact_thought: {title: "One thought, one person", minutes: 5, focus: gaze, steps: ["Place three objects around the room as 'people'.", "Deliver each full sentence to one object, then move to the next."], why: "Sentence-length eye contact feels personal without staring."}
  notes_glance:       {title: "Glance, then speak", minutes: 5, focus: gaze, steps: ["Look down at your notes in silence.", "Look up, then speak; never talk to the page."], why: "Keeps eye contact while still using notes."}
  lighthouse_sweep:   {title: "Lighthouse sweep", minutes: 5, focus: gaze, steps: ["Imagine the room as a 3x3 grid.", "Slowly move your attention left, centre, right, front and back across points.", "Repeat your talk and visit every zone at least twice."], why: "Spreads attention over the whole audience grid."}
  zone_assignment:    {title: "Zone assignment", minutes: 5, focus: gaze, steps: ["Assign each section of your talk to a different zone of the room.", "Deliver each section mainly to its zone."], why: "Guarantees no zone is neglected."}
  mirror_expressions: {title: "Mirror expressions", minutes: 5, focus: face, steps: ["Read a short emotional passage in front of a mirror.", "Let your face match the meaning of each sentence."], why: "Builds expression that supports the words."}
  smile_onset:        {title: "Smile on the greeting", minutes: 3, focus: face, steps: ["Practise your first and last sentence with a genuine smile.", "Notice how the voice warms with it."], why: "A warm start and finish lifts perceived engagement."}
  grounding_stance:   {title: "Grounding stance", minutes: 3, focus: posture, steps: ["Stand with feet hip-width apart, weight even.", "Deliver one minute keeping your head level and still between points."], why: "Stillness reads as confidence."}
  still_point:        {title: "Still point", minutes: 3, focus: posture, steps: ["Pick a spot at eye level.", "Hold your head still on it for each full sentence before moving."], why: "Reduces restless head movement."}
  box_breathing:      {title: "Box breathing", minutes: 3, focus: physiology, steps: ["Breathe in for 4 s, hold 4 s, out 4 s, hold 4 s.", "Repeat four rounds before speaking."], why: "Slows the heart rate before a talk (indicative, not medical advice)."}
  slow_exhale:        {title: "Long exhale", minutes: 2, focus: physiology, steps: ["Inhale for 4 s, exhale for 8 s, six times."], why: "Long exhales activate the calming response."}
  soft_focus:         {title: "Soft focus", minutes: 2, focus: physiology, steps: ["Relax your eyes on a point; breathe slowly for a minute before starting."], why: "Reduces tension-driven blinking."}
  prep_ritual:        {title: "Pre-talk ritual", minutes: 5, focus: confidence, steps: ["Two minutes of box breathing.", "Say your first sentence out loud three times.", "Stand tall for one minute before starting."], why: "A fixed ritual lowers anxiety and makes the start automatic."}
  emotion_mapping:    {title: "Emotion mapping", minutes: 8, focus: congruence, steps: ["Next to each paragraph of your script, write the emotion it should carry.", "Rehearse so your face and voice both show that emotion."], why: "Aligns what your voice and face say."}
  mirror_rehearsal:   {title: "Video check", minutes: 6, focus: congruence, steps: ["Record the mismatch segment again.", "Watch with the sound off, then listen with the picture off: do they tell the same story?"], why: "Separating channels shows where they disagree."}
  hook_rewrite:       {title: "Hook rewrite", minutes: 8, focus: content, steps: ["Write three new openings: a question, a surprising number and a 20-second story.", "Try each aloud and keep the strongest."], why: "The first 15 seconds decide whether people listen."}
  cold_open:          {title: "Cold open", minutes: 5, focus: content, steps: ["Start straight with your hook; introduce yourself after it."], why: "Removes the low-energy greeting opening."}
  cta_close:          {title: "Call-to-action close", minutes: 6, focus: content, steps: ["Write one sentence: what should the audience do or remember?", "End with it and stop; then say thank you."], why: "A clear last line is what people remember."}
  callback_close:     {title: "Callback close", minutes: 6, focus: content, steps: ["Return to your opening story or question in the last 20 seconds."], why: "Closing the loop makes a speech feel complete."}
  signpost_map:       {title: "Signpost map", minutes: 8, focus: structure, steps: ["List your main points.", "Write the transition sentence that moves between each pair ('First...', 'But here's the problem...').", "Rehearse only the transitions."], why: "Signposts let the audience follow the structure."}
  rule_of_three:      {title: "Rule of three", minutes: 6, focus: rhetoric, steps: ["Rewrite one key sentence as a list of three ('fast, fair and free').", "Deliver it with a pause before the third item."], why: "Tricolons are rhythmic and memorable."}
  anaphora_practice:  {title: "Anaphora practice", minutes: 6, focus: rhetoric, steps: ["Write three sentences starting with the same phrase ('We can...').", "Deliver them building in volume."], why: "Repetition at the start builds momentum."}
  story_injection:    {title: "Story injection", minutes: 10, focus: rhetoric, steps: ["Find a 30-second personal story that illustrates your main point.", "Place it right after the point."], why: "Stories carry emotional appeal (pathos)."}
  sensory_detail:     {title: "Sensory detail", minutes: 5, focus: rhetoric, steps: ["Add one thing the audience can see, hear or feel to each example."], why: "Concrete detail makes people feel the point."}
  evidence_sandwich:  {title: "Evidence sandwich", minutes: 8, focus: rhetoric, steps: ["For each claim: state it, give one fact or example, explain why it matters."], why: "Adds logical appeal (logos)."}
